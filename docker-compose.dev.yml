# Additions for local development, used together with docker-compose.yml (see the docker:* npm scripts).
# Never use this file on the NAS.
services:
  postgres:
    ports:
      # only reachable from this machine, for npm run dev and npm run db:*
      - "127.0.0.1:5432:5432"

  api:
    # the image is built from the local Dockerfile instead of being pulled from GHCR
    image: todo-api:${API_IMAGE_TAG:-local}
    build: .
    ports:
      # only for local development (Vite dev server, Postman), on the NAS the api has no published port
      - "127.0.0.1:3000:3000"

  frontend:
    # locally only on demand: --profile frontend. Built from the frontend repository next to this one
    # (FRONTEND_BUILD_CONTEXT changes the path); for daily work the Vite dev server of the frontend is enough.
    profiles: ["frontend"]
    image: todo-frontend:${FRONTEND_IMAGE_TAG:-local}
    build: ${FRONTEND_BUILD_CONTEXT:-../todo-frontend}

  updater:
    # the updater is meant for the NAS, locally it only starts on demand: --profile updater
    profiles: ["updater"]
    image: todo-api-updater:${UPDATER_IMAGE_TAG:-local}
    build:
      context: .
      target: updater
