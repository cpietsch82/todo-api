name: TodoAPI CI

on:
  pull_request:

  push:
    branches:
      - development

  release:
    types:
      - published

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Build, and Test
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Linting
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:run

  docker-development:
    runs-on: ubuntu-latest
    name: Docker Build and Push Development
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs: ci
    environment: development
    # only the docker jobs push to GHCR, the ci job (also running for pull requests) keeps read-only rights
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Short commit id
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # separate cache scopes per image, otherwise the second build overwrites the cache of the first one
      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/todo-api:dev
            ghcr.io/${{ github.repository_owner }}/todo-api:dev-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=todo-api
          cache-to: type=gha,mode=max,scope=todo-api

      # also reads the cache of the API image, so the shared builder stage is reused
      - name: Build and push updater image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: updater
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/todo-api-updater:dev
            ghcr.io/${{ github.repository_owner }}/todo-api-updater:dev-${{ steps.sha.outputs.short }}
          cache-from: |
            type=gha,scope=todo-api
            type=gha,scope=todo-api-updater
          cache-to: type=gha,mode=max,scope=todo-api-updater

  docker-production:
    runs-on: ubuntu-latest
    name: Docker Build and Push Production
    if: github.event_name == 'release'
    needs: ci
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "package.json version: ${{ needs.ci.outputs.version }}"
          echo "GitHub release version: $TAG_VERSION"

          if [ "${{ needs.ci.outputs.version }}" != "$TAG_VERSION" ]; then
            echo "Version mismatch!"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/todo-api:${{ needs.ci.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/todo-api:latest
          cache-from: type=gha,scope=todo-api
          cache-to: type=gha,mode=max,scope=todo-api

      - name: Build and push updater image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: updater
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/todo-api-updater:${{ needs.ci.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/todo-api-updater:latest
          cache-from: |
            type=gha,scope=todo-api
            type=gha,scope=todo-api-updater
          cache-to: type=gha,mode=max,scope=todo-api-updater
