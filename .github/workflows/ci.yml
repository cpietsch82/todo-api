name: TodoAPI CI

on:
  pull_request:

  push:
    branches:
      - development

  release:
    types:
      - published

jobs:
  ci:
    name: Lint, Build, and Test
    runs-on: ubuntu-latest
    environment: production

    outputs:
      version: ${{ steps.version.outputs.version }}

    permissions:
      contents: read
      packages: write

    env:
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
      REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
      ACCESS_TOKEN_TTL: ${{ vars.ACCESS_TOKEN_TTL }}
      REFRESH_TOKEN_TTL: ${{ vars.REFRESH_TOKEN_TTL }}
      REFRESH_TOKEN_TTL_MS: ${{ vars.REFRESH_TOKEN_TTL_MS }}
      RATE_LIMIT_PER_IP: ${{ vars.RATE_LIMIT_PER_IP }}
      RATE_LIMIT_WINDOW_MS: ${{ vars.RATE_LIMIT_WINDOW_MS }}
      BCRYPT_SALT_ROUNDS: ${{ vars.BCRYPT_SALT_ROUNDS }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DATABASE_URL: ${{ vars.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Linting
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:run

  docker-development:
    runs-on: ubuntu-latest
    name: Docker Build and Push Development
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Image Build
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/todo-api:dev \
            -t ghcr.io/${{ github.repository_owner }}/todo-api:dev-${GITHUB_SHA::7} \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/todo-api:dev
          docker push ghcr.io/${{ github.repository_owner }}/todo-api:dev-${GITHUB_SHA::7}

  docker-production:
    runs-on: ubuntu-latest
    name: Docker Build and Push Production
    if: github.event_name == 'release'
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "package.json version: ${{ needs.ci.outputs.version }}"
          echo "GitHub release version: $TAG_VERSION"

          if [ "${{ needs.ci.outputs.version }}" != "$TAG_VERSION" ]; then
            echo "Version mismatch!"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Image Build
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/todo-api:${{ needs.ci.outputs.version }} \
            -t ghcr.io/${{ github.repository_owner }}/todo-api:latest \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/todo-api:${{ needs.ci.outputs.version }}
          docker push ghcr.io/${{ github.repository_owner }}/todo-api:latest