services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # only reachable from this machine (e.g. for npm run dev), the api reaches postgres via the compose network
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  adminer:
    image: adminer:4
    container_name: todo-adminer
    # only started on demand: docker compose --profile dev up -d
    profiles: ["dev"]
    ports:
      # only reachable from the machine it runs on, use an SSH tunnel to reach it on the NAS
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: todo-api:latest
    env_file:
      - .env.api
    environment:
      # the logs are also written to the volume below (and always to stdout, see docker compose logs api).
      # The files are rotated daily or at 10 MB, the newest 14 are kept.
      LOG_FILE: /app/logs/api.log
    volumes:
      - api_logs:/app/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  # log files of the api (api.<date>.<number>.log, current.log points to the active one), on the NAS found under
  # the docker volume directory of this project (api_logs).
  # To read them in a normal folder instead, replace the volume mount of the api by "./logs:/app/logs" and
  # run "chown 1000:1000 logs" once, because the api runs as the user node (uid 1000).
  api_logs:
