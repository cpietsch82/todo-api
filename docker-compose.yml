# Base configuration, safe for production (the NAS). For development add docker-compose.dev.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres   (see the docker:* npm scripts)
#
# The versions and the updater settings come from deploy.env (see deploy.env.example), so on the NAS start with
#   docker compose --env-file deploy.env up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: todo-database
    env_file:
      - .env.database
    volumes:
      # the data lives in this folder (bind mount), the api reaches postgres through the compose network
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  adminer:
    image: adminer:4
    container_name: todo-adminer
    # only started on demand: docker compose --profile tools up -d adminer
    profiles: ["tools"]
    ports:
      # only reachable from the machine it runs on, use an SSH tunnel to reach it on the NAS
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    # fixed version of the image, no implicit "latest". It is changed by the updater (admin api) or by hand in deploy.env
    image: ghcr.io/cpietsch82/todo-api:${API_IMAGE_TAG:?API_IMAGE_TAG is not set, put it in deploy.env and use --env-file deploy.env}
    env_file:
      - .env.api
    environment:
      # the logs are also written to the folder below (and always to stdout, see docker compose logs api).
      # The files are rotated daily or at 10 MB, the newest 14 are kept.
      LOG_FILE: /app/logs/api.log
    volumes:
      # the api runs as the user node (uid 1000), so this folder has to be writable for it
      - ./api_logs:/app/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # no published port: the api is only reached through the frontend (nginx forwards /api to api:3000) inside of the
    # compose network. Because of that proxy TRUST_PROXY in .env.api has to count it (see .env.example).
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    # The web app (nginx with the built Vue app). It serves the app and forwards /api to the api, so the browser only
    # talks to one origin. The reverse proxy (Nginx Proxy Manager) points to this container.
    # The tag has a placeholder default instead of ":?", because compose resolves it for every command, also for the
    # commands of the updater and the local docker:* scripts, which do not need the frontend.
    image: ghcr.io/cpietsch82/todo-frontend:${FRONTEND_IMAGE_TAG:-set-FRONTEND_IMAGE_TAG-in-deploy.env}
    container_name: todo-frontend
    ports:
      - "${FRONTEND_PORT:-8090}:8080"
    # nginx runs as an unprivileged user and only writes to /tmp
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # the frontend also starts without a healthy api, /api then answers 502 until the api is back
    depends_on:
      - api
    restart: unless-stopped

  updater:
    # Executes the docker operations of the admin api (pull, deploy and rollback, restart), only for the service api.
    # It is the only container with access to docker, which means full control over the NAS: it has no ports and only
    # runs fixed commands. The variables have defaults on purpose (no ":?"), compose resolves them for every command,
    # also locally where the updater does not run; the updater itself refuses to start when the setup is incomplete.
    image: ghcr.io/cpietsch82/todo-api-updater:${UPDATER_IMAGE_TAG:-set-UPDATER_IMAGE_TAG-in-deploy.env}
    container_name: todo-updater
    env_file:
      # database connection and the other settings of the api (the updater uses the same code base)
      - .env.api
    environment:
      UPDATER_PROJECT_DIR: ${UPDATER_PROJECT_DIR:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # this folder at the SAME absolute path as on the host, so the relative paths of this file (./postgres_data,
      # ./api_logs) still point to the right folders when the updater runs docker compose
      - .:${UPDATER_PROJECT_DIR:-/updater-project-dir-not-set}
      # the docker login of the NAS (docker login ghcr.io); the images on GHCR are public, it is only needed for private ones
      - ${UPDATER_DOCKER_CONFIG:-/root/.docker/config.json}:/root/.docker/config.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    # a running deploy is finished before the updater stops (it can take a few minutes)
    stop_grace_period: 5m
    restart: unless-stopped
