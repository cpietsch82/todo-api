# Base configuration, safe for production (the NAS). For development add docker-compose.dev.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres   (see the docker:* npm scripts)
#
# The image tag comes from API_IMAGE_TAG. On the NAS it is set in .env.api, so start with
#   docker compose --env-file .env.api up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: todo-database
    env_file:
      - .env.database
    volumes:
      # the data lives in this folder (bind mount), the api reaches postgres through the compose network
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  adminer:
    image: adminer:4
    container_name: todo-adminer
    # only started on demand: docker compose --profile tools up -d adminer
    profiles: ["tools"]
    ports:
      # only reachable from the machine it runs on, use an SSH tunnel to reach it on the NAS
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    # fixed version of the image, no implicit "latest". Update: change API_IMAGE_TAG, then docker compose pull && up -d
    image: ghcr.io/cpietsch82/todo-api:${API_IMAGE_TAG:?API_IMAGE_TAG is not set, put it in .env.api and use --env-file .env.api}
    env_file:
      - .env.api
    environment:
      # the logs are also written to the folder below (and always to stdout, see docker compose logs api).
      # The files are rotated daily or at 10 MB, the newest 14 are kept.
      LOG_FILE: /app/logs/api.log
    volumes:
      # the api runs as the user node (uid 1000), so this folder has to be writable for it
      - ./api_logs:/app/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
